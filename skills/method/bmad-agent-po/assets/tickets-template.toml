# A container's agreed children, in its tickets/ folder; tickets.py ignores unknown keys.
# Table order is build order. `id` is permanent, never reused.
# One kind of table per file: [[initiative]] in a program (or parent initiative); [[epic]] or [[entry]] in an initiative; [[entry]] in an epic.
# No status here: the plan carries `status`; `tickets.py mirror` writes `tracker_status` to the leaf.
# next_id = 7 # written by `tickets.py move`; the folder's counter never goes below it

# ---- In an epic's tickets/ folder: one table per planned story, spike, or bug ----

[[entry]]
id = 1 # leaf file's `id:`
type = "story" # story | spike | bug
title = "Shoppers build a cart"
description = "A shopper adds, changes, and removes items on the live cart flow and the total updates cleanly. A person provisions the hosting account first." # 1-2 outcome sentences only; never a mini-spec
verify = "On the deployed site a shopper adds two items, changes a quantity, removes one, and the total matches."
covers = ["R1", "R2", "R3"] # leading R<n> ids in epic Requirements (covering E0X-FR-xx and instrumentation)
after = [] # prerequisites only, not sequence
hitl = true # a person does part of the work; the description names it
risk = "low" # low | medium | high
# estimate = 2 # only if the user gives one
# unknown = "..." # one-sentence user question; `tickets.py next` blocks the entry until removed
# UI-bearing entries cite DESIGN.md (initiative ux-system-* or epic), EXPERIENCE.md#<section>, and promoted mockups (plus relevant arch/contract refs) using {project-root}-relative paths; `pull` writes them under ## References:
# references = ["design — _bmad-output/initiative-checkout/ux-system-checkout/DESIGN.md", "design — _bmad-output/initiative-checkout/tickets/epic-checkout/ux-epic-checkout/EXPERIENCE.md#cart-flow", "design — _bmad-output/initiative-checkout/tickets/epic-checkout/ux-epic-checkout/mockups/cart.html", "architecture — _bmad-output/initiative-checkout/tickets/epic-checkout/arch-epic-checkout/arch-epic-checkout.md (AD-8)", "architecture — _bmad-output/initiative-checkout/tickets/epic-checkout/arch-epic-checkout/contract.yaml"]
# notes = ["..."] # user's words only; pull copies to Notes
refine = true # default: guards readiness until the Refined Story is approved at epic inception (or at pickup if left thin); omit only when building from a bare entry
# plan_checkpoint = true # a person reviews the ticket or plan first
# done_checkpoint = true # pause after it until a person says continue

[[entry]]
id = 2
type = "story"
title = "Shoppers pay less with codes and offers"
description = "Discount codes and automatic offers update the cart total through the pricing call, showing why when a code is refused."
verify = "A valid code and a qualifying offer each lower the total; an expired code is refused with its reason."
covers = ["R4", "R5", "R6"]
after = [1, "1.3"] # sibling id; "<epic id>.<entry id>"; "epic-<slug>"
hitl = false
risk = "medium"
refine = true

# ---- In an initiative's tickets/ folder: one table per epic ----

[[epic]]
id = 1
slug = "epic-pricing-rules" # the epic's folder, inside this tickets/ folder
title = "Pricing rules"
description = "Every price a shopper sees comes from one pricing function." # what is true when it is done; seeds the envelope's Outcome
covers = ["R1", "R2"]

[[epic]]
id = 2
slug = "epic-cart-rules"
title = "Shoppers manage their cart"
description = "A shopper adds, changes, and removes items and the total follows."
covers = ["R3", "R4", "R5"]
after = [{ epic = 1, needs = "the one-function pricing contract" }] # entries carry their own `after`

# ---- In a program's (or parent initiative's) tickets/ folder: one table per child initiative ----

[[initiative]]
id = 1
slug = "initiative-storefront" # the child's folder, inside this tickets/ folder
title = "Shoppers buy online"
description = "A shopper finds, prices, and pays for an order on the live site."
covers = ["R1", "R2"]

[[initiative]]
id = 2
slug = "initiative-fulfillment"
title = "Orders ship themselves"
description = "A paid order is picked, packed, and tracked without manual steps."
covers = ["R3"]
after = [{ initiative = 1, needs = "the order-paid event" }]
