# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-walkthrough.
# Mirrors the agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   strings: override wins • arrays (persistent_facts): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Executed when the workflow starts.
on_activation = ""

# Executed when a block is first presented.
on_block_activation = ""

# Facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Each entry is either:
#   - a literal sentence, e.g. "All stories must include testable acceptance criteria."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).
persistent_facts = []

# Executed when the user says a block is done.
on_block_complete = ""

# Executed when the user wraps up.
on_complete = ""

# Moves the walkthrough suggests per block. Overrides merge by `code`:
# a matching code replaces the move, a new code adds one. Each move has
# a `name` and a `description` that says what it does and when to
# suggest it; an empty `description` removes the move. Wrap-up is fixed.

[[workflow.moves]]
code = "second-opinion"
name = "Second opinion"
description = """
Put a question to a fresh subagent that does not have this review's \
conversation. Do not use any formal review skills. Suggest it when \
your own read may be anchored by the review so far."""

[[workflow.moves]]
code = "formal-review"
name = "Formal review"
description = """
Use the most appropriate formal review skill available. If it's code \
and `bmad-code-review` skill is installed, prefer that unless the user \
says otherwise. Suggest it for the riskiest block of the change."""

[[workflow.moves]]
code = "test"
name = "Test"
description = """
Help test the part under discussion. Identify useful checks and \
expected behavior, run what you can, and guide the user through \
observations that need them. Record what was actually tested, the \
results, and anything still unverified. Suggest it when behavior is \
easier to check than to reason out, or the tests do not cover it."""

[[workflow.moves]]
code = "drive"
name = "Drive"
description = """
Start the app and tell the user which buttons to push to see the \
target do its thing. Suggest it when the target is observable and the \
user has the app at hand."""

[[workflow.moves]]
code = "demo"
name = "Demo"
description = """
Exercise the change yourself and show the user what happened: \
screenshots or a transcript, in a rendered view the host offers; say \
which. Save them in the walkthrough folder and link them from the log. \
Suggest it when the target is observable and the user would rather \
watch than drive."""

[[workflow.moves]]
code = "draw"
name = "Draw"
description = """
Diagram the mechanism of the block, or of the whole change, showing \
only what the linked code does and marking what is new or changed, in \
a rendered view the host offers; say which. Pick the kind from what is \
new: a class diagram for new types and dependencies, a sequence \
diagram for a flow across components, or a state diagram for states. \
Label each relationship in words ("implements", "calls", "owns") \
rather than relying on arrowhead or diamond notation. Save the source \
in the walkthrough folder and link it from the log. Suggest it when \
the change adds structure the code doesn't show in one place."""
