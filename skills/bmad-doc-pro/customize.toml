# DO NOT EDIT -- overwritten on every update.
#
# Override files:
#   {project-root}/_bmad/custom/bmad-doc-pro.toml        (team)
#   {project-root}/_bmad/custom/bmad-doc-pro.user.toml   (personal)

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays: append
#   arrays-of-tables with `id`: replace matching items, append new ones.

# Runs after customization resolves, before facts, config and greet.
activation_steps_prepend = []

# Runs after greet, before the run begins.
activation_steps_append = []

# Loaded once per document: literal sentences, or `file:` paths and globs under {project-root}.
persistent_facts = []

# Consulted on demand beside web research; each entry names the tool and when to use it.
#   "For internal standards, consult corp:kb_search (database='engineering') before web search."
external_sources = []

# Polish passes at finalize, in order, structural before prose: `skill:NAME [args]`, `file:PATH` or plain text.
doc_standards = [
  "skill:bmad-review lenses=structure,prose",
]

# Run beside the rubric walker, same prefixes; resolved only when the review runs.
finalize_reviewers = []

# Where finished documents go beyond local files; each entry names the tool, destination and fields.
#   "Upload the document to Confluence via corp:confluence_upload (space_key='ENG')."
external_handoffs = []

# Run after close: one instruction, or an array run in order.
on_complete = ""

# Run folder for a template with no `additions.<id>.output`; `{active_initiative}` is dropped when none is set.
output = "{output_folder}/{active_initiative}/{id}-{slug}"

# A CSS file applied to every rendered view, after the default styles; empty uses the default.
style = ""

# "offer", "always" or "never"; a `view: slides` template renders unless "never".
html_view = "offer"

# `description` is the only text read when choosing. A team entry with a shipped `id` replaces it,
# a new `id` adds one, `disabled = true` hides one. Empty `rubric` uses assets/rubric-planning.md.

[[workflow.templates]]
id = "decision-record"
name = "Decision record"
description = "Any decision worth recording, from picking a supplier to an architecture decision: context, options, choice, consequences. Not for asking someone to approve the choice (proposal)."
file = "{skill-root}/assets/template-decision-record.md"
methods = ""
rubric = ""
disabled = false

[[workflow.templates]]
id = "postmortem"
name = "Postmortem"
description = "Something went wrong (an outage, a security incident, a failed launch, a missed deadline, a project over budget) and the team needs causes and actions, blamelessly. Not for judging a person's performance."
file = "{skill-root}/assets/template-postmortem.md"
methods = ""
rubric = ""
disabled = false

[[workflow.templates]]
id = "proposal"
name = "Proposal"
description = "Asking someone for money, time or approval: a grant, a bid, an internal request. Not for recording a decision already made (decision-record) or a talk with slides (pitch-deck)."
file = "{skill-root}/assets/template-proposal.md"
methods = ""
rubric = "{skill-root}/assets/rubric-proposal.md"
disabled = false

[[workflow.templates]]
id = "security-review"
name = "Security review"
description = "Reviewing a system against a security standard such as the OWASP Top 10 or STRIDE: a design or pre-release review, audit preparation, threat modeling a new feature. Not for an incident that has happened (postmortem)."
file = "{skill-root}/assets/template-security-review.md"
methods = "{skill-root}/assets/methods-security.csv"
rubric = ""
disabled = false

[[workflow.templates]]
id = "pitch-deck"
name = "Pitch deck"
description = "A talk or pitch that needs a story and slides, given by a presenter: an investor pitch, a conference or internal talk. An ask read without a presenter is a proposal."
file = "{skill-root}/assets/template-pitch-deck.md"
methods = ""
rubric = "{skill-root}/assets/rubric-proposal.md"
disabled = false

# What a team adds to a template without replacing it. Fields merge across layers and arrays append.
[workflow.additions]

# [workflow.additions.postmortem]
# facts = ["file:{project-root}/docs/oncall/severity-levels.md"]   # loaded once this template is chosen
# include = ["A section naming the on-call rotation at the time"]  # content the document must contain
# checks = ["Every action item has an owner and a due date"]       # added to the review
# polish = ["file:{project-root}/_bmad/style/company-voice.md"]    # run after doc_standards
# output = "docs/postmortems/{slug}"                               # the run folder itself
# style = "{project-root}/_bmad/style/incident.css"                # this template's rendered view
