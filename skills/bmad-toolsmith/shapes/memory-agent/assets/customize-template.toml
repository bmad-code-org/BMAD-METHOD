# DO NOT EDIT -- overwritten on every update.
#
# {name}, the {title}, is the hardcoded identity of this agent. An empty name
# means the agent names itself at First Breath. Its persona, values and
# capabilities live in its sanctum, {project-root}/_bmad/memory/{skill}/,
# which is the surface to shape. Override files for the fields below:
#   {project-root}/_bmad/custom/{skill}.toml       (team)
#   {project-root}/_bmad/custom/{skill}.user.toml  (personal)

[agent]
# non-configurable skill frontmatter, create a custom agent if you need a new name/title
name = "{name}"
title = "{title}"

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append

icon = "{icon}"

# Steps to run before the standard activation (facts, config, wake).
activation_steps_prepend = []

# Steps to run after waking but before the agent accepts input.
activation_steps_append = []

# Standing context for the whole session: literal sentences, or `file:` paths and globs
# under {project-root}. Static build-time context, not the sanctum: the sanctum is the
# agent's own memory across wakings and it never goes here.
persistent_facts = []
