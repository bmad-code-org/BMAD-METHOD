# Everything true of the whole {code} module. Unknown keys and tables are ignored.

[bmod]
code = "{code}"
version = "{version}"
update_source = "{update_source}"
skills = [{skills}]
required_skills = [{ skill = "bmad", version = "{bmad_version}", source = "github:bmad-code-org/BMAD-METHOD/skills" }]
{if-recommended}
# Nice to have alongside. `bmad` mentions these once and does not insist.
recommended_skills = [{recommended_skills}]
{/if-recommended}
pre_install_message = ""
post_install_message = ""
{if-questions}

# Asked by `bmad setup` in this order. Members read each answer as modules.{code}.<key>.
# `scope = "user"` makes an answer personal and uncommitted; leave it out for a team answer.
[[bmod.config_questions]]
key = "{key}"
prompt = "{prompt}"
default = "{default}"
{/if-questions}
