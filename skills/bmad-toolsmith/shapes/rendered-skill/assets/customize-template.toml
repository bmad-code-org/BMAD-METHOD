# DO NOT EDIT -- overwritten on every update.
#
# Default customization values for {name}.
# Override in {project-root}/_bmad/custom/{name}.toml (team) or
# {project-root}/_bmad/custom/{name}.user.toml (personal). A single run
# overrides with `--set workflow.<key>=<value>`.
#
# Merge rules: strings replace, lists append, tables merge key by key,
# arrays of tables merge by `id`.

[workflow]

# Instructions run before the user is greeted.
activation_steps_prepend = []

# Instructions run after the greeting and before step 01.
activation_steps_append = []

# Facts kept in context for the whole run: literal text, or `file:` paths and
# globs under {project-root}, loaded on activation.
persistent_facts = []

# {What the selector chooses between.} One of: "{value_a}", "{value_b}".
# Any other value halts the render.
{selector} = "{value_a}"

# {What the block instructs.} Replace the whole text to change the rule.
{block} = """
{default instruction, as many lines as it needs}
"""
