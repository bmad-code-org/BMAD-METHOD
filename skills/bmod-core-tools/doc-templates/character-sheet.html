<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-field="title">Character sheet</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6efe0; --ink: #2b2118; --muted: #6d5c49; --rule: #b9a585; --panel: #fbf7ee; --accent: #7c2d12;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: #3a3128; }
body { margin: 0; padding: 2rem 1rem; font: 16px/1.5 var(--serif); color: var(--ink); }
.sheet { max-width: 52rem; margin: 0 auto; padding: 2rem; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 40%); }
.banner { display: flex; gap: 1.5rem; align-items: stretch; padding-bottom: 1.25rem; border-bottom: 3px double var(--rule); }
.portrait { flex: 0 0 11rem; min-height: 11rem; padding: 0.75rem; background: var(--panel); border: 1px solid var(--rule); font-size: 0.85rem; font-style: italic; color: var(--muted); }
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
.portrait p { margin: 0; }
.identity { flex: 1; min-width: 0; }
h1 { margin: 0; font-size: 2.4rem; line-height: 1.1; color: var(--accent); }
.tagline { margin: 0.25rem 0 0.75rem; font-style: italic; color: var(--muted); }
.concept p:last-child { margin-bottom: 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 1.25rem; }
.card { padding: 0.75rem 1rem; background: var(--panel); border: 1px solid var(--rule); break-inside: avoid; }
.card.wide, .rest { grid-column: 1 / -1; }
.card h2, .rest h2 { margin: 0 0 0.35rem; font: 600 0.75rem/1.3 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.card p, .card ul, .card ol, .rest p { margin: 0 0 0.5rem; }
.card > div > :last-child > :last-child { margin-bottom: 0; }
table { width: 100%; border-collapse: collapse; font: 0.85rem/1.35 var(--sans); }
th, td { padding: 0.25rem 0.4rem; border: 1px solid var(--rule); text-align: left; }
th { background: var(--paper); }
pre { white-space: pre-wrap; font: inherit; margin: 0; }
@media (max-width: 36rem) {
  .banner { flex-direction: column; }
  .portrait { flex-basis: auto; }
  .grid { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  html { background: none; }
  body { padding: 0; }
  .sheet { max-width: none; border: 0; box-shadow: none; padding: 0; }
}
</style>
</head>
<body>
<main class="sheet">
  <header class="banner">
    <div class="portrait" data-section="Portrait"></div>
    <div class="identity">
      <h1 data-field="title"></h1>
      <p class="tagline" data-field="tagline"></p>
      <div class="concept" data-section="Concept"></div>
    </div>
  </header>
  <div class="grid">
    <section class="card" data-section="Appearance"><h2>Appearance</h2><div data-body></div></section>
    <section class="card" data-section="Personality"><h2>Personality</h2><div data-body></div></section>
    <section class="card wide" data-section="Background"><h2>Background</h2><div data-body></div></section>
    <section class="card wide" data-section="Abilities"><h2>Abilities</h2><div data-body></div></section>
    <section class="card" data-section="Relationships"><h2>Relationships</h2><div data-body></div></section>
    <section class="card" data-section="Secrets"><h2>Secrets</h2><div data-body></div></section>
    <section class="card wide" data-section="Arc"><h2>Arc</h2><div data-body></div></section>
    <section class="rest" data-rest></section>
  </div>
</main>
</body>
</html>
