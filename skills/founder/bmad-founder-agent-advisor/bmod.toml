[bmod]
code = "founder"
version = "6.13.0-next"
update_source = "github:bmad-code-org/BMAD-METHOD/skills/founder"
required_skills = [
  { skill = "bmad", version = "6.13.0", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
  { skill = "bmad-facilitate", version = "6.13.0", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
]
pre_install_message = ""
post_install_message = """Founder is installed.
Ask for Nadia, the Founder Advisor: test an idea, run your runway or cap table, work out pricing, write a fundraising plan, a grant application or a pitch deck, then pitch it to her investor room. She keeps the business record in one folder of this project, so every document quotes the same figures."""

# Asked by `bmad setup`. The skill reads the answer as modules.founder.record_folder.
[[bmod.config_questions]]
key = "record_folder"
prompt = "Where should the business record live (company facts, funders, decisions, the material you hand over)? In a vault, use the folder its AGENTS.md names for the business."
default = "{project-root}/company"

[skill]
recommended_skills = [
  { skill = "bmad-brainstorming", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
  { skill = "bmad-deep-recon", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
  { skill = "bmad-forge-idea", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
  { skill = "bmad-party-mode", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
]
