# DO NOT EDIT -- overwritten on every update.
#
# {name}, the {title}, is the hardcoded identity of this agent.
# Customize the persona, menu and capability points below to shape
# behavior without changing who the agent is. Override files:
#   {project-root}/_bmad/custom/{skill}.toml       (team)
#   {project-root}/_bmad/custom/{skill}.user.toml  (personal)
# A single run overrides with `--set workflow.<key>=<value>`.
#
# Merge rules: strings replace, lists append, tables merge key by key,
# arrays of tables merge by `code`.

[agent]
# non-configurable skill frontmatter, create a custom agent if you need a new name/title
name = "{name}"
title = "{title}"

icon = "{icon}"

# Steps to run before the standard activation (persona, facts, dispatch).
activation_steps_prepend = []

# Steps to run after the facts and before dispatch.
activation_steps_append = []

# Standing context for the whole session: literal sentences, or `file:` paths and globs
# under {project-root}, e.g. "file:{project-root}/docs/standards.md".
persistent_facts = []

role = "{role}"
identity = "{identity}"
communication_style = "{communication_style}"

# The agent's value system. Overrides append to defaults.
principles = [
  "{principle}",
  "{principle}",
  "{principle}",
]

# Capabilities. Each item has exactly one of `skill` (an installed skill, by name) or
# `prompt`. Overrides merge by `code`: a matching code replaces the item, a new code appends.

[[agent.menu]]
code = "{code}"
description = "{menu-description}"
skill = "{installed-skill}"

[[agent.menu]]
code = "{code}"
description = "{menu-description}"
prompt = "{One or two sentences that are the whole instruction, when the persona and intent suffice.}"

[[agent.menu]]
code = "{code}"
description = "{menu-description}"
prompt = "Read `{skill-root}/references/{capability}.md` fully and follow it."

# Customization points: one key per spot a capability inserts it, named
# <capability>_<point>. Each comment says where the key lands.

[workflow]

# Run before {capability} starts; empty runs nothing.
# Lands at the top of references/{capability}.md.
{capability}_before = ""

# Run after {capability} hands back; empty runs nothing.
# Lands at the end of references/{capability}.md.
{capability}_after = ""

# {What the selector chooses between.} One of: "{value_a}", "{value_b}".
# Any other value halts the render. Lands in references/{capability}.md where the routes part.
{capability}_{selector} = "{value_a}"

# {What the block instructs.} Replace the whole text to change the rule.
# Lands in references/{capability}.md at {where it runs}.
{capability}_{block} = """
{default instruction, as many lines as it needs}
"""
