# DO NOT EDIT -- overwritten on every update.
#
# Override files:
#   {project-root}/_bmad/custom/bmad-facilitate.toml        (team)
#   {project-root}/_bmad/custom/bmad-facilitate.user.toml   (personal)

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays: append
#   arrays-of-tables with `id`: replace matching items, append new ones.

# Runs after customization resolves, before facts, config and greet.
activation_steps_prepend = []

# Runs after greet, before the run begins.
activation_steps_append = []

# Loaded once per document: literal sentences, or `file:` paths and globs under {project-root}.
persistent_facts = []

# Consulted on demand beside web research; each entry names the tool and when to use it.
#   "For internal standards, consult corp:kb_search (database='engineering') before web search."
external_sources = []

# Polish passes at finalize, structural before prose: `skill:NAME [args]`, `file:PATH` or plain text.
# `file:` and plain-text rules apply in every depth tier; `skill:` passes scale with Finalize depth.
doc_standards = [
  "skill:bmad-review lenses=structure,prose",
]

# Run beside the rubric walker in Standard and Thorough (skipped in Quick / lowest stakes).
finalize_reviewers = []

# Where finished documents go beyond local files; each entry names the tool, destination and fields.
#   "Upload the document to Confluence via corp:confluence_upload (space_key='ENG')."
external_handoffs = []

# Run after close: one instruction, or an array run in order.
on_complete = ""

# The mode every run starts in, over each template's own `mode`; empty leaves it to the template,
# else "freeform". "freeform" works conversationally across sections in any order, updating the
# document quietly in the background; "step-by-step" takes the sections one at a time in order;
# "fast" drafts first and then walks the assumptions. The user can switch anytime during a run. A
# template with `order: fixed` runs freeform as step-by-step.
mode = ""

# Run folder for a template with no `output`; `{active_initiative}` is dropped when none is set.
output = "{output_folder}/{active_initiative}/{id}-{slug}"

# Where templates live, searched in order; the first template with an id wins. To add, replace or
# extend (`extends: <id>`) a template, put a file in the first folder. Each entry is a
# folder, one template file, a GitHub URL (pin a version with @ref) or a sentence naming the tool
# that reaches it. Installed modules' doc-templates/ folders are searched after these. A template
# overrides this skill, so point only at sources you control.
template_libraries = [
  "{project-root}/_bmad/custom/facilitate-templates",
  "~/.bmad/facilitate-templates",
]

# Design guidance applied to every HTML view, over each template's own: a CSS file, a design-system
# doc, a starter HTML file, a reference screenshot path, or verbal aesthetic preferences; empty
# lets each document's domain drive the visual design.
style = ""

# How far documents go in showing instead of telling: one instruction, used wherever a template
# does not say otherwise. Replace it to change the forms used, or to hold documents to text and tables.
visuals = "Wherever a reader would take in a picture faster than the paragraph it replaces, make the picture: a flow, a sequence, a timeline, a structure, a comparison, figures with a trend or a split. A table or a Mermaid diagram covers most of these. Draw an SVG yourself for what they show poorly: a scale with its thresholds marked, a two-by-two, before-and-after bars, nested sizes, a rough sketch of a screen or a layout. Use a generated image when a tool for one is available and the picture is of a thing, not of data. Leave out any picture that only decorates or restates a point one sentence makes."

# Global view default: "offer", "always", or "never" (setting "never" overrides templates to disable
# HTML views everywhere). Empty leaves it to each template, else "offer".
view = ""
