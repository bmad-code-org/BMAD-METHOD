# The method module's first migration, v6 to v7. `bmad migrate` runs a module's `migration-<n>.toml` files in `<n>` order.

[migration]
module = "method"
from = "6"
to = "7"
title = "Move v6 planning and implementation artifacts into the v7 initiative layout"
summary = "Turns the v6 planning folder into a v7 initiative with its documents moved as whole folders, turns epics.md and sprint-status.yaml into a ticket tree with joined plans, sets the active initiative, and, when the user wants it, puts the store in its own repository or a workspace."

# Read-only signals. Any one of them makes this migration worth offering; the first two are v6 for certain.
detect = """
- `epics.md` under the folder `modules.bmm.planning_artifacts` names, or `sprint-status.yaml` under `modules.bmm.implementation_artifacts`.
- Story files in the implementation folder named `<epic>-<story>-<slug>.md` or `spec-<epic>-<story>-<slug>.md` whose frontmatter has `route:` and `status:` (the v6 build spec shape).
- Dated artifact folders under the planning folder: `prds/prd-<name>-<date>/prd.md`, `briefs/brief-<name>-<date>/brief.md`, `ux-designs/ux-<name>-<date>/DESIGN.md`, `architecture/architecture-<name>-<date>/ARCHITECTURE-SPINE.md`.
- `specs/spec-<slug>/SPEC.md` under `core.output_folder`, with or without `stories.yaml` and a `stories/` folder.
It applies only while there is no `active_initiative` under `[core]` in `_bmad/custom/config.user.toml` and no `initiative-*/` folder holding a same-named file under the output folder. A project that already has those, with `tickets.toml` and a ticketing store config, is on v7; say so and stop unless the user names v6 leftovers to bring in.
"""

# The layout the migration moves toward. `<root>` is `{output_folder}` from the BMad config.
target = """
<project-root>/.v6-v7-migration-backup-<datetime>/   # a full copy of `_bmad/` and the source folders, made first
<root>/
  initiative-<slug>/                # the v6 planning folder, renamed
    initiative-<slug>.md            # the envelope
    tickets.toml                    # one [[epic]] per epic, in build order
    prd-<name>-<date>/              # each v6 document folder, moved whole, its name kept
      prd-<name>-<date>.md          # the main file, renamed to match its folder
    epic-<slug>/
      epic-<slug>.md                # the epic envelope
      tickets.toml                  # one [[entry]] per story, in build order
      story-<slug>-plan.md          # the v6 build record; owns status
      epic-<slug>-retrospective.md  # historical retrospectives
    archive-v6/                     # the v6 tracking sources, folded story files, and earlier build records, unchanged
  backlog/                          # loose story-, spike-, bug-<slug>.md with no epic, flat
  archive/                          # older document versions the user chose to archive, unchanged
  migration-v6-v7/migration-v6-v7.md  # the plan and verification record
  party-mode/                       # and anything else the migration does not own, left where it was
A moved document folder keeps its v6 name, dates and sequence numbers included. Names the migration writes from scratch (the envelope, epic folders, plans) follow the v7 ticketing names; `archive-v6/` and `migration-v6-v7/` name versions. `initiative-<slug>/`, `backlog/`, and `archive/` are always created.
"""

# Asked in one round after the inventory, defaults filled in from what was found. Other questions come up in the guide where they apply.
questions = """
| Question | Default |
|---|---|
| Your planning content is `<planning folder>` (a short summary) and your implementation content is `<implementation folder>` (a short summary). Right, and is there any elsewhere? | Yes; none elsewhere |
| Will this work touch other repositories, or should the planning files keep their own git history apart from the code? (`workspace`) | No |
"""

precautions = """
- Nothing changes before the plan is approved. The only writes before approval are the backup and the plan file.
- Nothing is deleted unless the user chose it. The backup is never committed, moved, or edited.
- Read in full only what the migration rewrites: `epics.md`, `sprint-status.yaml`, `stories.yaml`, story files, and retrospectives. Classify everything else from its path, frontmatter, and first heading, and move it unchanged.
- When the files are under git, every move is a `git mv`, so history follows the file.
"""

guide = """
## Sequence

Run these in order. Each names the section that holds its rules.

1. Find the source folders ("Source folders").
2. Make the backup ("Backup").
3. Inventory the source folders ("Inventory").
4. Ask the `questions`.
5. Write the plan and wait for approval ("Plan").
6. Make the repository changes the answers ask for (`workspace`).
7. Create the initiative and move the documents ("Documents").
8. Write the ticket tree and plans ("The ticket tree").
9. Convert spec folders with stories ("Spec folders with stories.yaml").
10. Place loose implementation files ("Loose implementation files").
11. List what stays in place ("What stays in place").
12. Rewrite paths ("Path rewrites").
13. Update configuration and clean up ("Configuration and cleanup").
14. Run every `checklist` item and record its result in the plan. Fix and recheck a failure, or report it; never skip one.
15. Report ("Report").

In a repository that already existed, commit the current state before step 6 and after each of steps 6 to 13, the message naming the step; never stage the backup. In a repository the migration creates, commit nothing until the report offers it. Never push.

## Source folders

Read `_bmad/config.toml` and the `_bmad/custom/` overrides for `core.output_folder`, `modules.bmm.planning_artifacts`, and `modules.bmm.implementation_artifacts`. Those are the source folders; a user may have renamed any of them, and the questions confirm them. When `bmad setup` already removed these keys, read them from `_bmad/` in the `.v6-v7-migration-backup-*/` folders, newest first, using the first that has them.

## Backup

Copy `_bmad/` and the whole output folder to `<project-root>/.v6-v7-migration-backup-<datetime>/` (`<datetime>` as `YYYYMMDD-HHMM`), with the planning and implementation folders too when they sit outside it, write a `.gitignore` there holding `*`, and confirm the copy holds every file. When `bmad setup` already made one, copy into that one; its `_bmad/` is already there.

## Inventory

List every file under the source folders, recursively, and which `detect` signals matched; the questions show the user a summary of it. When an answer names another location, inventory it the same way and ask again only the questions it changes.

## Plan

Write `<root>/migration-v6-v7/migration-v6-v7.md` with frontmatter `type: migration`, `title`, `status: draft`, `created`. When stories are in progress or in review, ask whether to finish them in v6 first (the default). The plan holds every answer, including those the sections below ask for, what moves where, each story's v7 entry and status, the files left in place with the reason, and the config and repository changes. Wait for the user to approve it.

## Documents

A file belongs to an initiative when the PRD's or `epics.md`'s `inputDocuments` name it, a story references it, or the user says so.

The planning folder is renamed to `initiative-<slug>/` at the store root, and everything in it goes along, files the migration does not recognize included. When the planning folder is the output folder itself, create `initiative-<slug>/` and move the planning documents into it instead. The initiative is named after `core.project_name`. When the inventory suggests several (two PRDs, two briefs, architectures for different products), recommend a grouping and ask; the planning folder becomes the first, and the others get their document folders moved in.

Inside the initiative, each v6 document moves as a unit: its run folder with every file in it, or a flat file into a folder named after its stem (`prd.md`, a bare type, gets the project name: `prd-<project>/`). A run folder under a grouping folder (`prds/`, `briefs/`) moves up to the initiative's top level, and the emptied grouping folder is removed. The folder keeps its v6 name. The one change inside is that the main file is renamed to match its folder and gains `type`, `title`, and `created` frontmatter when it lacks them; when the folder has no single main file, a router named after the folder lists what each file is. When several folders or files share a name apart from a date or sequence number, ask whether they are all still relevant or the older ones move to `archive/`.

| v6 | Main file | Skill |
|---|---|---|
| `prds/prd-<name>-<date>/`, or flat `prd*.md` | `prd.md` | `bmad-prd` |
| `briefs/brief-<name>-<date>/`, or flat `*brief*.md` | `brief.md` | `bmad-product-brief` |
| `architecture/architecture-<name>-<date>/`, or flat `architecture*.md` | `ARCHITECTURE-SPINE.md` | `bmad-architecture` |
| `ux-designs/ux-<name>-<date>/`, or flat `ux*.md` | router beside `DESIGN.md` and `EXPERIENCE.md` | `bmad-ux` |
| `prfaq-<name>.md` with its `-distillate.md` | `prfaq-<name>.md`; the distillate moves with it | `bmad-prfaq` |
| `research/<type>-<topic>-<date>/`, or flat `research/*-research-<date>.md` | the run's report | `bmad-deep-recon`, v6 research |
| `sprint-change-proposal-<date>.md` | itself | `bmad-correct-course` |
| `implementation-readiness*.md` | itself | v6 readiness check |
| A sharded document (`<name>/index.md` plus sections) | `index.md` | any |

From elsewhere in the output folder, a `brainstorming/` session and a `specs/spec-<slug>/` folder without `stories.yaml` move in the same way when they belong to the initiative; the spec's main file is `SPEC.md`.

## The ticket tree

Write from `bmad-ticket`'s templates (`bmad-ticket/assets/`).

Initiative envelope: `initiative-<slug>/initiative-<slug>.md` from the initiative template. Title from the project name; Description and Outcome from the PRD's summary; Done when from the PRD's goals; References naming the PRD, architecture, and UX folders; `covers` the PRD's requirement ids. Its `tickets.toml` gets one `[[epic]]` per `## Epic N:` in `epics.md`, in that order: `id = N`, `slug = "epic-<slug>"`, `title`, `covers` the FR ids the coverage map assigns to that epic. Where `epics.md` states what one epic needs from another, write `after = [{ epic = <id>, needs = "..." }]` there and `after: [epic-<slug>]` in the dependent epic's file, which holds every ticket under it until the named epic is done.

Each epic: `epic-<slug>/epic-<slug>.md` from the epic template. The slug is the epic title, kebab-case, without its number. Description and Outcome from the epic goal; Requirements from the FR lines the coverage map assigns to it, each keeping its id; Done when written from those requirements and confirmed with the user; `parent` the initiative folder; `status` from `sprint-status.yaml`, `in-progress` and `done` as they are and no `status` line for `backlog`. An epic's v6 retro reports combine into `epic-<slug>-retrospective.md` in its folder, the name `bmad-retrospective` reads, and an `epic-N-retrospective: done` line becomes a `Retrospective:` line in the epic's Notes naming it.

Each `### Story N.M:` becomes an `[[entry]]` in that epic's `tickets.toml`, in the order written: `id = M` as v6 wrote it, quoted when it has a letter (`id = "6a"` for Story 2.6a), `type = "story"`, `title`, `description` (the "I want" sentence, restated as what exists when it is done), `verify` (one line distilled from its acceptance criteria), `covers` (the FR ids its criteria trace to, from the coverage map), `after = []` unless `epics.md` states that the story needs another, `hitl = false`, `risk = "low"` unless the text says otherwise, and `v6_key = "N-M-<slug>"`, the v6 key, kept for search. An epic or story heading with no number gets the next unused number, in the order written. A story file with no matching `### Story` gets an entry written from the file's own intent, with the next unused `id`, and the plan flags it.

### Build records

A v6 story file (`<N>-<M>-<slug>.md` or `spec-<N>-<M>-<slug>.md` in the implementation folder) is a build record. Ask whether to fold unstarted stories' files into their entries (default yes): v7 plans a story when work starts, and a file written early goes stale as earlier stories change the code. When folding, a story whose status, after the file and `sprint-status.yaml` are reconciled, is `backlog`, `ready-for-dev`, `drafted`, or `contexted` gets no plan: its file's intent, criteria, and verification go into its entry, and the file moves to `archive-v6/` unchanged. Any other build record moves beside its entry as `story-<slug>-plan.md`, keeping all criteria, implementation history, and review findings, with the criteria from `epics.md` merged in. Several records for one `<N>-<M>`, whatever their slugs, make one plan: the newest (highest `-<n>` suffix, else latest commit) is the plan, the others' criteria and history go into it under `## Prior builds`, and their files move to `archive-v6/`. Frontmatter: `ticket`, the entry's id (a backlog plan uses its leaf file stem); `status`, mapped below; a build `type` (`feature`, `bugfix`, `refactor`, or `chore`), never `story`; and `baseline_revision` only when the record holds a trustworthy one or a recorded equivalent. Never infer a baseline from today's HEAD; list each missing one in the report.

A story with no build record stays an entry with no plan, its full original criteria kept in the entry's description beside its intent. When tracking shows a status past `backlog` but the record is missing, write a minimal plan with that mapped status, saying the record is missing. Never write epic story files; the builder reads the entry and its epic. Plans stay in the live tree: they own status, baseline evidence, and review history.

| v6 (`sprint-status.yaml`, story file) | v7 |
|---|---|
| `backlog` | entry only without a build record; an existing build record not folded becomes a `draft` plan |
| `ready-for-dev` | `ready-for-dev` |
| `in-progress` | `in-progress` |
| `review`, `in-review` | `in-review` |
| `done` | `done` |
| `drafted`, `contexted` (older v6) | `ready-for-dev` |
| `blocked` | `blocked` |

Map any other value to the closest one above; when it is unclear, ask the user.

### Action items and archive-v6

Each `open` or `in-progress` item in `sprint-status.yaml`'s `action_items` becomes an `Action item:` line in the initiative's Notes with its owner and epic; `done` items are dropped. Then `sprint-status.yaml`, `epics.md`, and any `epic-<N>-context.md` cache move to `archive-v6/` unchanged.

## Spec folders with stories.yaml

A `spec-<slug>/` holding `stories.yaml` and `stories/` that belongs to the initiative becomes an epic: create `epic-<slug>/` with the spec folder inside it as its requirement source; the epic's and each entry's `covers` cite the spec's `CAP-N` ids. Each `stories.yaml` entry becomes an `[[entry]]` in list order with its `id`, `title`, `description`, original criteria, and verification. An id with a dash loses it (`3-2` becomes `32`, `CC-2` becomes `CC2`; the next unused number on a clash), and the original goes in `v6_key`. Each declared prerequisite becomes an `after` naming the migrated sibling id, cross-epic entry, or epic slug; report any that do not resolve for correction without dropping them, and never infer one from list order. The build record rules apply to its entries: each `stories/<id>-<slug>.md`, matched by its original id, moves as `story-<slug>-plan.md`, and an entry with no record gets a plan only when tracking shows a later status. `RETROSPECTIVE.md` follows the retrospective rule. Move `stories.yaml` to `archive-v6/` unchanged. Add the epic to the initiative's `tickets.toml`; its `status` is `done` when every story is.

## Loose implementation files

A `spec-<slug>.md` in the implementation folder with no epic and no story number was possibly a single `bmad-build` run. For tracked standalone work, write `backlog/story-<slug>.md` (or `bug-<slug>.md`) with its original intent and criteria, and move the record beside it as `<type>-<slug>-plan.md` under the build record rules. When the user names an existing epic for it, it becomes an entry there instead. It can also stay direct build input outside the tree; never create an epic for it. `deferred-work.md` moves to the initiative folder unchanged. Walkthrough logs, test summaries (`tests/test-summary.md`), and other evidence move unchanged into the epic they concern, else the initiative.

## What stays in place

These stay where they are, listed in the plan and the report with the reason:

- `party-mode/`: v7 party mode reads its memory there.
- `project-context.md`: `bmad-project-context` offers to absorb it.
- `brainstorming/` sessions, `specs/` folders, and `forge/` that belong to no initiative.
- What another installed module claims: a path its config names (TEA's `test-artifacts/`), or one its own migration (`knowledge.py` `migrations`) covers.
- Anything else at the store root or in the implementation folder. List it as not recognized, with this note: the migration leaves these alone; moving them is the user's call, and if a BMad module wrote one, that module's migration missed it and is worth an issue.

## Path rewrites

Search the store for each old path and rewrite live references to it: `companions:`, `inputDocuments:`, References sections, prose links. This is a search, not a read of every document. Every moved file outside `archive-v6/` and `archive/` also has its own relative links and paths recomputed from its new folder, so they reach the same target whether it moved or not. Archived files and files left in place stay unchanged.

Then search the rest of the project, outside the store and `_bmad/`, for the old source folder paths. Never edit those files: list each one, with its line, in the plan and the report as a reference the user updates.

## Configuration and cleanup

Record `active_initiative = "initiative-<slug>"` under `[core]` in `_bmad/custom/config.user.toml`, creating the file if needed. When the store moved (`workspace`), set `output_folder` under `[core]` in `_bmad/custom/config.toml`, the committed team override, never in the installer-managed `_bmad/config.toml`. A `_bmad/custom/` override that names a moved path, such as a `persistent_facts` line, is shown in the plan with its new path and rewritten on approval. Leave `planning_artifacts` and `implementation_artifacts` alone; `bmad setup` owns the rest of `_bmad/`. The repo store needs no store config.

Remove empty v6 folders left behind, and add a `.gitkeep` to any created folder that is empty.

## Report

Set the plan's `status` to `done`. When the migration created the store's repository, offer its initial commit now; declined, say the tree is uncommitted.

Report the tree with `uv run <project-root>/_bmad/method/scripts/tickets.py --project-root <project-root> status <initiative folder>`, the archived sources, the files left in place, and missing baselines. Name the backup folder and say it is the user's to delete once they are satisfied, or now if version control already holds the old state. Say that `bmad-ticket` replaces the removed `bmad-sprint-planning` and `bmad-create-epics-and-stories`. Next: `bmad-build` on the next entry, with no story file pulled; `bmad-code-review` on a historical plan, leaving its status; `bmad-retrospective` on the epic; `bmad-project-context` for a root `AGENTS.md` naming the active initiative and any workspace conventions. Standalone intent remains valid build input.
"""

# What the repository answers in `questions` mean in files. Each is shown as a target tree in the plan and done
# before the artifacts move, so history follows the files. Skipped when every answer keeps things as they are.
workspace = """
The store as its own repository, inside this project: `git init` in the output folder, then in the project repo `git rm -r --cached <output folder>` and add the folder to the project's `.gitignore`, so the two repositories do not track the same files. The project's history keeps the old copies; the store's history starts at the migration.

The store beside the project, in a workspace: create the workspace folder, move the project checkout into it as `<project>/`, move `_bmad/` and the output folder up to the workspace root, and `git init` the output folder. Then run `bmad setup` at the workspace root, where every session starts from now on. A second project joining later migrates into the same store as its own initiative; `bmad setup` reports its leftover `_bmad/`.

The rules and the reasons are in `help/monorepo-and-polyrepo.md`.
"""

# Verification. Every item is checked and its result recorded; an item that cannot be checked is reported as such.
checklist = [
  "Every file from the v6 source folders is under an initiative (its `archive-v6/` included), `backlog/`, or `archive/`, or the plan and report list it as left in place, with the reason.",
  "Every moved document folder kept its v6 name and every file in it, and holds a main file named after the folder or a router. `initiative-<slug>/`, `backlog/`, and `archive/` exist, each with a `.gitkeep` when otherwise empty.",
  "Dated or numbered versions of one document are all present under their own names, unless the user chose to archive the older ones, as the plan records.",
  "`uv run <project-root>/_bmad/method/scripts/tickets.py --project-root <project-root> status <initiative folder>` exits 0 for every initiative; story counts match the archived tracking sources, excluding epic and retrospective keys, with backlog counted separately.",
  "Every classic or spec story is one entry, every story's build records one plan (or, when folded, its entry plus archived files), and no epic story files were written. `find` returns each expected plan, joined by id in an epic and by file stem in backlog.",
  "Every plan has a build type and a mapped status; done stays done, review stays in-review, nothing is relabeled built, supported baselines are kept, and missing ones are disclosed. Retrospectives sit directly in their epic with `epic`, only an evidenced verdict, and no ticket or leaf type.",
  "Every epic `covers` id exists in the initiative's requirement source, every entry `covers` id in its epic's Requirements, and every requirement in the PRD's coverage map has at least one entry.",
  "Every live path in `companions:`, `inputDocuments:`, References sections, and prose links resolves to a file from the folder that holds it now; archived files and files left in place keep their original paths. A path already dead in v6 is listed apart and does not fail the item; one the migration broke does.",
  "`_bmad/custom/config.user.toml` names the active initiative under `[core]`, and `core.output_folder` resolves to the store.",
  "The store is under git as the user answered, no file is tracked by two repositories, and in a new workspace `bmad status` at its root reports the installation current.",
  "`.v6-v7-migration-backup-<datetime>/` holds every file the source folders held before the migration, and no commit includes it.",
  "The plan records every question, its answer and reason, the backup's path, every file the user identified, and each item's result.",
]
