code: apf
name: "AI Product Factory"
version: 2
description: "Codex-first, risk-proportional product and project delivery extension for BMAD"
default_selected: false

# APF extends BMAD core; it does not replace canonical core workflows.
header: "AI Product Factory v2 Configuration"
subheader: "Configure a compact product lifecycle and project-delivery operating layer."

apf_artifacts:
  prompt: "Where should APF lifecycle artifacts be stored?"
  default: "{output_folder}/apf-artifacts"
  result: "{project-root}/{value}"

execution_adapter:
  prompt: "Which execution adapter should APF use?"
  default: "codex"
  result: "{value}"
  single-select:
    - value: "codex"
      label: "Codex (default)"
    - value: "generic"
      label: "Generic compatible agent"

execution_profile:
  prompt: "Which execution economy profile should be the default?"
  default: "balanced"
  result: "{value}"
  single-select:
    - value: "economy"
      label: "Economy — minimal safe process"
    - value: "balanced"
      label: "Balanced — risk-proportional default"
    - value: "assurance"
      label: "Assurance — more verification for higher-risk work"

directories:
  - "{apf_artifacts}"
  - "{apf_artifacts}/runs"
  - "{apf_artifacts}/evidence"
  - "{apf_artifacts}/gates"

agents:
  - code: bmad-apf-founder
    name: Alex
    title: Founder Operator
    icon: "🚀"
    team: product-factory
    description: "Coordinates founder context, evidence, and lifecycle routing."

  - code: bmad-apf-product-operator
    name: Jordan
    title: Product Operator
    icon: "📋"
    team: product-factory
    description: "Coordinates product scope, metrics, and canonical BMAD planning ownership."

  - code: bmad-apf-product-engineer
    name: Archie
    title: Product Engineer
    icon: "🏗️"
    team: product-factory
    description: "Coordinates long-running technical delivery and migration work."

  - code: bmad-apf-growth-operator
    name: Morgan
    title: Growth Operator
    icon: "📈"
    team: product-factory
    description: "Coordinates evidence-led launch, measurement, and iteration."
