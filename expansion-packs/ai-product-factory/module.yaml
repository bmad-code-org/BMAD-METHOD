code: apf
name: "AI Product Factory"
description: "Operating system for builders — transform a single idea into a production-ready digital product"
default_selected: false

# Extends BMAD Method (bmm) — does not replace it.
# Software engineering foundation remains in BMM; APF adds product-oriented vertical.

header: "AI Product Factory Configuration"
subheader: "Configure the product factory settings for your startup build.\nThese settings orchestrate the journey from idea to launch."

# Inherits from core: user_name, project_name, communication_language,
# document_output_language, output_folder

apf_artifacts:
  prompt: "Where should AI Product Factory artifacts be stored? (Validation reports, business models, launch assets)"
  default: "{output_folder}/apf-artifacts"
  result: "{project-root}/{value}"

product_type:
  prompt: "What type of product are you building?"
  default: "saas"
  result: "{value}"
  single-select:
    - value: "mobile-app"
      label: "Mobile App (iOS/Android)"
    - value: "saas"
      label: "SaaS Web Application"
    - value: "landing"
      label: "Landing Page / Marketing Site"
    - value: "telegram-bot"
      label: "Telegram Bot"
    - value: "ai-agent"
      label: "AI Agent / Assistant"
    - value: "custom"
      label: "Custom / Mixed"

target_platform:
  prompt: "Primary target platform for implementation?"
  default: "web"
  result: "{value}"
  single-select:
    - value: "web"
      label: "Web (Next.js / React)"
    - value: "flutter"
      label: "Flutter (cross-platform mobile)"
    - value: "react-native"
      label: "React Native"
    - value: "swiftui"
      label: "SwiftUI (native iOS)"
    - value: "multi"
      label: "Multi-platform"

launch_kit:
  prompt: "Which launch kit matches your product?"
  default: "auto"
  result: "{value}"
  single-select:
    - value: "auto"
      label: "Auto-detect from product type"
    - value: "mobile-app"
      label: "Mobile App Kit"
    - value: "landing"
      label: "Landing Kit"
    - value: "saas"
      label: "SaaS Kit"
    - value: "telegram"
      label: "Telegram Kit"
    - value: "ai-agent"
      label: "AI Agent Kit"

directories:
  - "{apf_artifacts}"
  - "{apf_artifacts}/founder"
  - "{apf_artifacts}/product"
  - "{apf_artifacts}/ux"
  - "{apf_artifacts}/design"
  - "{apf_artifacts}/engineering"
  - "{apf_artifacts}/deployment"
  - "{apf_artifacts}/marketing"
  - "{apf_artifacts}/growth"

# Agent roster — product-oriented agents across 8 layers
agents:
  # Founder Layer
  - code: bmad-apf-startup-coach
    name: Alex
    title: Startup Coach
    icon: "🚀"
    team: product-factory
    description: "Orchestrates the founder journey from idea to launch. Routes between specialized agents and maintains artifact continuity across phases."

  - code: bmad-apf-idea-validator
    name: Ivy
    title: Idea Validator
    icon: "💡"
    team: product-factory
    description: "Stress-tests startup ideas before build investment. Produces validation reports with go/no-go recommendations."

  - code: bmad-apf-market-research
    name: Morgan
    title: Market Research Agent
    icon: "📈"
    team: product-factory
    description: "Quantifies market opportunity with TAM/SAM/SOM analysis and demand signals."

  - code: bmad-apf-competitor
    name: Casey
    title: Competitor Agent
