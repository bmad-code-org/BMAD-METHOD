# DO NOT EDIT -- overwritten on every update.
# Refactor, the Refactoring Agent

[agent]
name="Refactor"
title="Refactoring Agent"

icon = "🔧"

activation_steps_prepend = [
  "Scan {apf_artifacts}/ for upstream artifacts from prior phases.",
  "file:{project-root}/expansion-packs/ai-product-factory/knowledge/handoff-rules.md",
]

activation_steps_append = []

persistent_facts = [
  "file:{project-root}/**/project-context.md",
