# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Kept deliberately in step with greptile.json: both bots read the same shared
# guideline files and are given the same scoped instructions, so their findings
# can be compared rather than merged.

language: en-US
early_access: true
tone_instructions: |
  Skip subjective copy-editing or voice preferences, but do flag prompt-quality
  defects defined in tools/skill-authoring.md, canon.md, and standards.md —
  including bloat, bolted-on hedging, over-explaining, and broken progressive
  disclosure. Never ask to pad prompts with defensive edge-case qualifiers.

reviews:
  profile: chill
  high_level_summary: false  # don't post summary until explicitly invoked
  request_changes_workflow: false
  review_status: false
  commit_status: false
  collapse_walkthrough: true  # `walkthrough: false` is not a schema key; this is the real knob
  poem: false
  pre_merge_checks:
    # Docstring coverage is on by default at an 80% threshold; the renderer's
    # private helpers carry none and no repo rule asks for them.
    docstrings:
      mode: 'off'
  auto_review:
    enabled: true
    drafts: false  # Don't review drafts automatically
    auto_incremental_review: false  # always review the whole PR, not just new commits
    base_branches: [dev]
  path_filters:
    # --- Shared baseline: tool configs ---
    - '!.coderabbit.yaml'
    - '!docs-site/eslint.config.mjs'
    # --- Shared baseline: build output ---
    - '!dist/**'
    - '!build/**'
    - '!coverage/**'
    # --- Shared baseline: vendored/generated ---
    - '!**/node_modules/**'
    - '!**/*.min.js'
    - '!**/*.generated.*'
    - '!**/*.bundle.md'
    # --- Shared baseline: package metadata ---
    - '!docs-site/package-lock.json'
    # --- Shared baseline: binary/media (globs, so `**/` is required to reach subdirs) ---
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.svg'
    # --- Shared baseline: test fixtures ---
    - '!test/fixtures/**'
    - '!tools/tests/fixtures/**'
    - '!test/template-test-generator/**'
    - '!tools/template-test-generator/test-scenarios/**'
    # --- Shared baseline: non-project dirs ---
    - '!_bmad*/**'
    - '!docs-site/public/**'
    - '!docs-site/diagrams/**'
    - '!z*/**'
    - '!sample-project/**'
    - '!test-project-install/**'
    # --- Shared baseline: AI assistant dirs ---
    - '!.claude/**'
    - '!.codex/**'
    - '!.agent/**'
    - '!.agentvibes/**'
    - '!.kiro/**'
    - '!.roo/**'
    - '!.github/chatmodes/**'
    # --- Shared baseline: build temp ---
    - '!.bundler-temp/**'
    # --- Shared baseline: generated reports ---
    - '!**/validation-report-*.html'
    - '!CHANGELOG.md'
  path_instructions:
    - path: skills/**
      instructions: |
        Source changed. Check whether docs/ needs a matching update — new
        features, changed behavior, renamed concepts, altered CLI flags, or
        modified configuration options should all be reflected in the relevant
        doc pages. Flag missing or outdated docs.
    - path: skills/**/*.md
      instructions: |
        Prompt text read by an agent at runtime (skills, agents, templates,
        references, and module help/ files). Review against both repository
        correctness and the Toolsmith authoring bar in tools/skill-authoring.md,
        skills/toolsmith/bmad-toolsmith/canon.md, and
        skills/toolsmith/bmad-toolsmith/lenses/standards.md (which supersede
        older step-file/module.yaml notes in tools/skill-validator.md):
        - Correctness: unresolved paths or cross-references (module help/ files
          use module-relative `help/<topic>.md` refs), wrong skill invocation
          syntax, documented behavior code does not implement, and genuine
          factual contradictions across files.
        - Prompt quality: bloat, dense paragraphs, bolted-on hedging or exotic
          corner cases, over-explaining what a capable model can infer, broken
          progressive disclosure (inlining branch-only procedures instead of
          references/ or topic files), and core-vs-module leaks
          (skills/core-tools/ must stay 100% module-agnostic).
        - Do not treat a concise summary that omits fallbacks documented
          elsewhere as a contradiction, and prefer suggesting cuts or
          simplifications over adding extra qualifiers or branches.
    - path: skills/*/*-agent-*/**
      instructions: |
        Agent skill. The persona is configured in customize.toml under [agent]:
        check that every {agent.*} placeholder the SKILL.md interpolates has a
        corresponding key there, and that menu entries name skills that exist
        in this repo.
    - path: docs/**/*.md
      instructions: |
        Documentation file. Check that internal markdown links point at files
        that exist, and that the page follows docs/_STYLE_GUIDE.md.
    - path: tools/**
      instructions: |
        Build script/tooling. Check error handling and that failures exit
        non-zero.
    - path: skills/**/scripts/**
      instructions: |
        Skill script/tooling. Check error handling and that failures exit
        non-zero.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - tools/skill-authoring.md
      - skills/toolsmith/bmad-toolsmith/canon.md
      - skills/toolsmith/bmad-toolsmith/lenses/standards.md
      - tools/skill-validator.md

chat:
  auto_reply: true  # Response to mentions in comments, a la @coderabbit review

issue_enrichment:
  auto_enrich:
    enabled: false  # don't auto-comment on issues
