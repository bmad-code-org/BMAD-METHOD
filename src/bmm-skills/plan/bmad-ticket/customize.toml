# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-ticket.
# Team overrides:     {project-root}/_bmad/custom/bmad-ticket.toml
# Personal overrides: {project-root}/_bmad/custom/bmad-ticket.user.toml

[workflow]

# --- Universal defaults. Merge: scalars override, arrays append. ---
activation_steps_prepend = []
activation_steps_append = []
persistent_facts = ["file:{project-root}/**/project-context.md"]
on_complete = ""

# The initiative folder — the root of one initiative's work. The skill reads
# and writes the ticket tree at {project_root}/tickets/, and the initiative
# node itself lives at {project_root}/ticket.md. Sibling folders (prd/, spec/,
# brief/) belong to other skills and are never scanned as tickets.
#
# Default is the bare work store at {project-root}/.bmad-obeya, which is the
# "no initiative set" case: tickets land straight in its `tickets/` bin and
# the tree simply has no initiative node. Once an initiative is active, this
# resolves to {project-root}/.bmad-obeya/<initiative>. Pointing it somewhere
# else — a docs folder, a dedicated work-store repo — is a config change and
# a folder move, never a migration.
project_root = "{project-root}/.bmad-obeya"

# Optional "initiative-name=KEY" entries consulted at tree bootstrap before
# asking (interactive) or deriving from the initiative name (autonomous —
# a derived key is flagged as unconfirmed in the completion report).
project_keys = []

# Ticket templates, one per type. The templates drive the output shape,
# so an org wanting a different AC rendering (Given/When/Then, EARS-style
# shall-statements) swaps the template — the skill does not change.
story_template = "assets/story-template.md"
bug_template = "assets/bug-template.md"
task_template = "assets/task-template.md"
spike_template = "assets/spike-template.md"
epic_template = "assets/epic-template.md"

# Allowed leaf status moves ("from>to"). scripts/update_ticket.py refuses
# any move not listed unless --force carries an explicit user decision;
# states outside the graph's vocabulary are refused always. Overrides
# append (widen the graph — e.g. add a custom state and its edges);
# removing a default edge means forking. Overrides reach the gate through
# the --transitions flag the skill passes; a direct script call without
# the flag falls back to the bundled defaults.
# Defaults = the schema-1 lifecycle: backlog → in-progress → review →
# done; dropped from any active state; review may bounce back to
# in-progress. done is terminal.
lifecycle_transitions = [
  "backlog>in-progress",
  "in-progress>review",
  "review>in-progress",
  "review>done",
  "backlog>dropped",
  "in-progress>dropped",
  "review>dropped",
]

# Allowed node (initiative, epic) status moves. Nodes run their own lifecycle:
# backlog → ready → in-progress → done, dropped from any active state.
# `ready` means inception is finished and work can start — it records a
# decision, it does not gate anything downstream (an unready epic with
# workable stories still blocks nothing). Nothing here is ever calculated
# from children: a node is done because somebody looked at the outcome and
# agreed, so `done` can never flip when a child is added later. Progress
# against children is derived by `ticket_tree.py board` instead — it is
# information about a node, not its state. Merge behavior matches
# lifecycle_transitions: overrides append.
node_lifecycle_transitions = [
  "backlog>ready",
  "backlog>in-progress",
  "backlog>done",
  "backlog>dropped",
  "ready>backlog",
  "ready>in-progress",
  "ready>done",
  "ready>dropped",
  "in-progress>done",
  "in-progress>dropped",
]

# hitl derives from risk: hitl = (risk >= hitl_threshold), overridable
# per ticket. Hard floors (schema migrations, data deletion, auth,
# payments → risk 4 minimum, hitl true) are not configurable.
hitl_threshold = 3

# Review lenses run over the full draft before the user ever sees it
# (and before autonomous mode approves its own), plus any org standards
# (definition-of-ready, INVEST checklist). Entries are `skill:` or
# `file:` references or plain text. The baked entry names its three
# lenses explicitly, which runs them whatever the content class — the
# verification-gap lens is scoped to code, and tickets are docs.
# Append-only: an org adds its bar; the baked lenses cannot be removed
# downstream (fork to change them).
finalize_reviewers = [
  "skill:bmad-review lenses=adversarial,edge-case-hunter,verification-gap",
]

# Bug severity scale (how bad the defect is — distinct from risk, which
# scores the fix). Overrides append (add bands); renaming or removing a
# baked band means forking the skill. Advisory for the conversation: the
# scripts validate severity as an integer 1-5 regardless of added bands.
severity_scale = [
  "1 — cosmetic: annoyance, no functional impact",
  "2 — minor: workaround exists, limited users affected",
  "3 — major: core function impaired, workaround painful",
  "4 — critical: core function broken or data at risk, no workaround",
  "5 — showstopper: outage, data loss, or security exposure",
]
