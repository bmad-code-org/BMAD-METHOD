      <rect x="660" y="1190" width="220" height="86" rx="18" fill="#ffd6a3" stroke="#ef6c00"/>
      <rect x="900" y="1190" width="220" height="86" rx="18" fill="#ffe9a8" stroke="#e99a00"/>
    </g>
    <g fill="#111" font-size="31" font-weight="700" text-anchor="middle">
      <text x="530" y="1246">승인</text>
      <text x="770" y="1246">재작업</text>
      <text x="1010" y="1246">논의</text>
