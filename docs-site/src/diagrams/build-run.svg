<svg class="bmad-diagram" viewBox="0 0 940 676" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="bd-title">
<title id="bd-title">The bmad-build run: intent is clarified and planned, with open questions put to you. A small change goes straight to implementation; a larger one waits for you to approve the plan. Review, by one quick lens or four thorough ones, can patch the work, send it back to planning, reject a finding, or defer it, before the result is presented to you.</title>
