<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-labelledby="scenario-team-title scenario-team-desc">
<title id="scenario-team-title">Plan a Feature as a Team, step by step</title>
<desc id="scenario-team-desc">For the initiative, John writes and validates the PRD, Sofia writes the initiative and two epics, Sally optionally designs what the epics share, and Winston optionally settles their shared decisions; for each epic, Sofia refines it, Sally and Winston optionally cover only what is new, Sofia puts the stories on the board, Mason builds each story and adds a review for production work unless the build ran a thorough one, Mason runs the retrospective, and Sofia validates and closes the epic.</desc>
