<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title description">
  <title id="title">The BMad delivery loop</title>
  <desc id="description">Three kinds of input enter the delivery loop at different points: a vague notion enters at Clarify, a big clear idea enters at Plan, and a small change goes straight to Build and verify. The loop continues through Learn and adjust, which feeds back into planning as the work evolves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dg-accent)"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dg-ink)"/>
    </marker>
  </defs>
  <path d="M0 70H1120M0 140H1120M0 210H1120M0 280H1120M0 350H1120M140 0V420M280 0V420M420 0V420M560 0V420M700 0V420M840 0V420M980 0V420" stroke="var(--dg-accent)" stroke-opacity=".06"/>

  <!-- Entry drops: each input lands where it enters the loop -->
  <path d="M155 140V194" stroke="var(--dg-ink)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
  <path d="M425 140V194" stroke="var(--dg-ink)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
  <path d="M695 140V194" stroke="var(--dg-ink)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gold)"/>

  <!-- Main path and feedback loop -->
  <path d="M250 244H330" stroke="var(--dg-accent)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M520 244H600" stroke="var(--dg-accent)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M790 244H870" stroke="var(--dg-accent)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M965 288C965 368 425 368 425 288" fill="none" stroke="var(--dg-accent)" stroke-opacity=".75" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)"/>

  <!-- Vague notion: cloud with a question mark -->
  <g transform="translate(155 76) scale(3.8) translate(-12 -12)">
    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="var(--dg-surface)" stroke="var(--dg-muted)" stroke-width=".7" stroke-dasharray="2 2.4"/>
  </g>

  <!-- Big clear idea: large bulb -->
  <circle cx="425" cy="66" r="26" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="2.5"/>
  <rect x="415" y="92" width="20" height="9" rx="2.5" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="2.5"/>
  <path d="M401 42L394 35M449 42L456 35" stroke="var(--dg-ink)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small change: small bulb -->
  <circle cx="695" cy="80" r="14" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="2"/>
  <rect x="688.5" y="94" width="13" height="6" rx="2" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="2"/>
  <path d="M681.5 66.5L676.5 61.5M708.5 66.5L713.5 61.5" stroke="var(--dg-ink)" stroke-width="2" stroke-linecap="round"/>

  <g text-anchor="middle">
    <text x="560" y="28" fill="var(--dg-ink)" font-size="14" font-weight="700" letter-spacing="1.5" data-i18n="start-anywhere">START ANYWHERE</text>
    <text x="155" y="94" fill="var(--dg-muted)" font-size="32" font-weight="700" data-i18n="label">?</text>
    <text x="155" y="128" fill="var(--dg-ink)" font-size="16" font-weight="600" data-i18n="vague-notion">Vague notion</text>
    <text x="425" y="128" fill="var(--dg-ink)" font-size="16" font-weight="600" data-i18n="big-clear-idea">Big clear idea</text>
    <text x="695" y="128" fill="var(--dg-ink)" font-size="16" font-weight="600" data-i18n="small-change">Small change</text>

    <g transform="translate(60 200)">
      <rect width="190" height="88" rx="12" fill="var(--dg-surface)" stroke="var(--dg-accent)" stroke-opacity=".7" stroke-width="2"/>
      <text x="95" y="51" fill="var(--dg-ink)" font-size="21" font-weight="600" data-i18n="clarify">Clarify</text>
    </g>
    <g transform="translate(330 200)">
      <rect width="190" height="88" rx="12" fill="var(--dg-surface)" stroke="var(--dg-accent)" stroke-opacity=".7" stroke-width="2"/>
      <text x="95" y="51" fill="var(--dg-ink)" font-size="21" font-weight="600" data-i18n="plan">Plan</text>
    </g>
    <g transform="translate(600 200)">
      <rect width="190" height="88" rx="12" fill="var(--dg-surface)" stroke="var(--dg-accent)" stroke-opacity=".7" stroke-width="2"/>
      <text x="95" y="51" fill="var(--dg-ink)" font-size="21" font-weight="600" data-i18n="build-and-verify">Build and verify</text>
    </g>
    <g transform="translate(870 200)">
      <rect width="190" height="88" rx="12" fill="var(--dg-surface)" stroke="var(--dg-accent)" stroke-opacity=".7" stroke-width="2"/>
      <text x="95" y="51" fill="var(--dg-ink)" font-size="21" font-weight="600" data-i18n="learn-and-adjust">Learn and adjust</text>
    </g>
    <text x="560" y="396" fill="var(--dg-muted)" font-size="17" font-weight="600" letter-spacing="1.4" data-i18n="right-sized-for-the-work-in-front-">RIGHT-SIZED FOR THE WORK IN FRONT OF YOU</text>
  </g>
</svg>
