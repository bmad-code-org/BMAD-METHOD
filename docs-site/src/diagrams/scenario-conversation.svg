<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" role="img" aria-labelledby="scenario-conversation-title scenario-conversation-desc">
<title id="scenario-conversation-title">Build from a Conversation, step by step</title>
<desc id="scenario-conversation-desc">In Clarify, bmad-ingest turns a call into a cited note, or a brainstorm leaves a summary; Sofia writes the initiative from it, then the epics and the first epic's stories in Plan; bmad-build builds one story per chat and you mark each done; the retrospective judges the finished epic, then Sofia validates and closes it.</desc>
<defs>
<marker id="scenario-conversation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="scenario-conversation-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<text class="k" x="1" y="17">CLARIFY</text>
<rect class="node hot" x="1" y="24" width="170" height="50" rx="2"/>
<text class="n" x="86" y="46">Call or brainstorm</text>
<text class="sub mid" x="86" y="63">becomes a note or summary</text>
<text class="k" x="197" y="17">PLAN</text>
<rect class="node" x="197" y="24" width="170" height="50" rx="2"/>
<text class="n" x="282" y="46">Sofia</text>
<text class="sub mid" x="282" y="63">the initiative, answered</text>
<path class="edge" d="M171 49 H196" marker-end="url(#scenario-conversation-arrow)"/>
<text class="k" x="393" y="17">PLAN</text>
<rect class="node" x="393" y="24" width="170" height="50" rx="2"/>
<text class="n" x="478" y="46">Sofia</text>
<text class="sub mid" x="478" y="63">epics, then stories</text>
<path class="edge" d="M367 49 H392" marker-end="url(#scenario-conversation-arrow)"/>
<text class="k" x="589" y="17">BUILD</text>
<rect class="node" x="589" y="24" width="170" height="50" rx="2"/>
<text class="n" x="674" y="46">bmad-build</text>
<text class="sub mid" x="674" y="63">one story per chat</text>
<path class="edge" d="M563 49 H588" marker-end="url(#scenario-conversation-arrow)"/>
<text class="k" x="1" y="107">BUILD</text>
<rect class="node" x="1" y="114" width="170" height="50" rx="2"/>
<text class="n" x="86" y="136">You</text>
<text class="sub mid" x="86" y="153">mark each story done</text>
<path class="edge" d="M674 74 V92 H86 V113" marker-end="url(#scenario-conversation-arrow)"/>
<text class="k" x="197" y="107">LEARN</text>
<rect class="node" x="197" y="114" width="170" height="50" rx="2"/>
<text class="n" x="282" y="136">bmad-retrospective</text>
<text class="sub mid" x="282" y="153">on the finished epic</text>
<path class="edge" d="M171 139 H196" marker-end="url(#scenario-conversation-arrow)"/>
<text class="k" x="393" y="107">LEARN</text>
<rect class="node" x="393" y="114" width="170" height="50" rx="2"/>
<text class="n" x="478" y="136">Sofia</text>
<text class="sub mid" x="478" y="153">validates, closes the epic</text>
<path class="edge" d="M367 139 H392" marker-end="url(#scenario-conversation-arrow)"/>
</svg>
