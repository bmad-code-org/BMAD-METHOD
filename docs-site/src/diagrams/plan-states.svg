<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" role="img" aria-labelledby="ps-title ps-desc">
<title id="ps-title">The initiative's states, in order</title>
<desc id="ps-desc">The initiative's states in order, each with its next step: no initiative yet, Sofia writes it; open questions, Sofia walks them with you; not sliced, Sofia cuts it into epics; shared design, optionally bmad-agent-ux-designer, adopted; shared decisions, optionally bmad-agent-architect, adopted; epic not refined, Sofia refines it; no stories yet, Sofia plans them; stories ready, bmad-build, one per chat.</desc>
<defs>
<marker id="ps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="ps-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<text class="k" x="1" y="17">INITIATIVE</text>
<rect class="node hot" x="1" y="24" width="170" height="50" rx="2"/>
<text class="n" x="86" y="46">No initiative yet</text>
<text class="sub mid" x="86" y="63">Sofia writes it</text>
<text class="k" x="197" y="17">INITIATIVE</text>
<rect class="node" x="197" y="24" width="170" height="50" rx="2"/>
<text class="n" x="282" y="46">Open questions</text>
<text class="sub mid" x="282" y="63">Sofia walks them with you</text>
<path class="edge" d="M171 49 H196" marker-end="url(#ps-arrow)"/>
<text class="k" x="393" y="17">INITIATIVE</text>
<rect class="node" x="393" y="24" width="170" height="50" rx="2"/>
<text class="n" x="478" y="46">Not sliced</text>
<text class="sub mid" x="478" y="63">Sofia cuts it into epics</text>
<path class="edge" d="M367 49 H392" marker-end="url(#ps-arrow)"/>
<text class="k" x="589" y="17">INITIATIVE · optional</text>
<rect class="node" x="589" y="24" width="170" height="50" rx="2"/>
<text class="n" x="674" y="46">Shared design?</text>
<text class="sub mid" x="674" y="63">bmad-agent-ux-designer, adopted</text>
<path class="edge soft" d="M563 49 H588" marker-end="url(#ps-arrow-soft)"/>
<text class="k" x="1" y="107">INITIATIVE · optional</text>
<rect class="node" x="1" y="114" width="170" height="50" rx="2"/>
<text class="n" x="86" y="136">Shared decisions?</text>
<text class="sub mid" x="86" y="153">bmad-agent-architect, adopted</text>
<path class="edge soft" d="M674 74 V92 H157.9 V113" marker-end="url(#ps-arrow-soft)"/>
<text class="k" x="197" y="107">EPIC</text>
<rect class="node" x="197" y="114" width="170" height="50" rx="2"/>
<text class="n" x="282" y="136">Epic not refined</text>
<text class="sub mid" x="282" y="153">Sofia refines it</text>
<path class="edge" d="M171 139 H196" marker-end="url(#ps-arrow)"/>
<text class="k" x="393" y="107">EPIC</text>
<rect class="node" x="393" y="114" width="170" height="50" rx="2"/>
<text class="n" x="478" y="136">No stories yet</text>
<text class="sub mid" x="478" y="153">Sofia plans them</text>
<path class="edge" d="M367 139 H392" marker-end="url(#ps-arrow)"/>
<text class="k" x="589" y="107">STORY</text>
<rect class="node" x="589" y="114" width="170" height="50" rx="2"/>
<text class="n" x="674" y="136">Stories ready</text>
<text class="sub mid" x="674" y="153">bmad-build, one per chat</text>
<path class="edge" d="M563 139 H588" marker-end="url(#ps-arrow)"/>
