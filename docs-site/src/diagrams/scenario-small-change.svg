<svg class="bmad-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 88" role="img" aria-labelledby="scenario-small-change-title scenario-small-change-desc">
<title id="scenario-small-change-title">Make a Small Change, step by step</title>
<desc id="scenario-small-change-desc">Describe the change to bmad-build, answer what only you know, let it build, review and commit, then check the result. Every step is in Build and verify.</desc>
<defs>
<marker id="scenario-small-change-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="scenario-small-change-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<text class="k" x="1" y="17">BUILD</text>
<rect class="node hot" x="1" y="24" width="170" height="50" rx="2"/>
<text class="n" x="86" y="46">bmad-build</text>
<text class="sub mid" x="86" y="63">your change, in one line</text>
<text class="k" x="197" y="17">BUILD</text>
<rect class="node" x="197" y="24" width="170" height="50" rx="2"/>
<text class="n" x="282" y="46">Your answers</text>
<text class="sub mid" x="282" y="63">what only you know</text>
<path class="edge" d="M171 49 H196" marker-end="url(#scenario-small-change-arrow)"/>
<text class="k" x="393" y="17">BUILD</text>
<rect class="node" x="393" y="24" width="170" height="50" rx="2"/>
<text class="n" x="478" y="46">Code, tests, review</text>
<text class="sub mid" x="478" y="63">committed locally</text>
<path class="edge" d="M367 49 H392" marker-end="url(#scenario-small-change-arrow)"/>
<text class="k" x="589" y="17">BUILD</text>
<rect class="node" x="589" y="24" width="170" height="50" rx="2"/>
<text class="n" x="674" y="46">You check it</text>
<text class="sub mid" x="674" y="63">nothing to mark done</text>
<path class="edge" d="M563 49 H588" marker-end="url(#scenario-small-change-arrow)"/>
</svg>
